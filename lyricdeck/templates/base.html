<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LyricDeck{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('songs.index') }}">LyricDeck</a>
    <nav>
      <a href="{{ url_for('songs.index') }}">Songs</a>
      <a href="{{ url_for('build.build_form') }}">Make a deck</a>
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
